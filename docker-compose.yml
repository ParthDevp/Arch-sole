services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: arch_and_sole
      POSTGRES_USER: archsole
      POSTGRES_PASSWORD: archsole_local_password
    ports:
      - "5433:5432"
    volumes:
      - archsole_pg:/var/lib/postgresql/data

  backend:
    build: ./arch-and-sole-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/arch_and_sole
      DATABASE_USERNAME: archsole
      DATABASE_PASSWORD: archsole_local_password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-this-local-password
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8081:8081"
    depends_on:
      - postgres

volumes:
  archsole_pg:
